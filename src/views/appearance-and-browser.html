                accept=".json, .txt, .css, .docx"
                hidden
              />

          </div>

        <!-- 2. 主屏幕视觉卡片 -->
        <div class="settings-group-card">
          <div class="settings-section-title">主屏幕视觉</div>

              <span class="toggle-switch-slider"></span>
            </label>
          </div>

          <div class="setting-row">
            <label class="setting-label">夜间模式</label>
            <label class="toggle-switch-label">

              <input type="checkbox" id="theme-toggle-switch" />
              <span class="toggle-switch-slider"></span>
            </label>
          </div>

          <div class="setting-row">
            <label class="setting-label">去除文字阴影</label>
            <label class="toggle-switch-label">
              <input type="checkbox" id="remove-home-font-shadow-toggle" />
              <span class="toggle-switch-slider"></span>
            </label>
          </div>

          <div class="setting-item">
            <label>主屏幕壁纸</label>
            <div class="preview-upload-box">
              <div id="wallpaper-preview" class="mini-preview">预览</div>
              <button
                class="upload-btn-pill"

                  document.getElementById('wallpaper-upload-input').click()

                更换壁纸
              </button>
            </div>
            <input
              type="file"
              id="wallpaper-upload-input"
              accept="image/*"
              hidden
            />
          </div>

            <label>图标/组件字体颜色</label>
            <div class="color-picker-wrapper">

              <input

                id="home-icon-widget-text-color-picker"
                value="#FFFFFF"
              />

              <!-- 2. 文本输入框，允许手动输入颜色代码 -->
              <input
                type="text"
                id="home-icon-widget-text-color-input"
                placeholder="#FFFFFF"
                maxlength="7"
                spellcheck="false"
              />
            </div>
          </div>

          <!-- 主屏幕预设部分 -->
          <div class="setting-item">
            <label>主屏幕预设管理</label>
            <div

              style="margin-top: 5px; border: none; padding: 0"

              <div class="form-group">
                <select
                  id="home-preset-selector"
                  class="moe-input select"
                ></select>
                <div class="preset-manager-controls compact">
                  <button
                    id="apply-home-preset-btn"
                    class="preset-btn-capsule preset-btn-apply"
                    disabled
                  >
                    应用
                  </button>
                  <button
                    id="save-home-preset-btn"
                    class="preset-btn-capsule preset-btn-save"
                  >
                    保存当前
                  </button>
                  <button
                    id="update-home-preset-btn"
                    class="preset-btn-capsule preset-btn-secondary"
                    disabled
                  >
                    更新
                  </button>
                  <button
                    id="rename-home-preset-btn"
                    class="preset-btn-capsule preset-btn-secondary"
                    disabled
                  >
                    重命名
                  </button>
                  <button
                    id="delete-home-preset-btn"
                    class="preset-btn-capsule preset-btn-delete"
                    disabled
                  >
                    删除
                  </button>
                  <button
                    id="import-home-preset-btn"
                    class="preset-btn-capsule preset-btn-secondary"
                  >
                    导入
                  </button>
                  <button
                    id="export-home-preset-btn"
                    class="preset-btn-capsule preset-btn-secondary"
                    disabled
                  >
                    导出
                  </button>
                  <input
                    type="file"
                    id="import-home-preset-input"
                    accept=".json"
                    hidden
                  />
                </div>
              </div>
            </div>
          </div>

        <div class="settings-group-card">

          <div class="setting-item">

              </button>
              <button id="add-passerby-avatar-btn" class="moe-btn-secondary">
                添加头像
              </button>
            </div>

        </div>

        <!-- 3. App 图标与名称卡片 -->
        <div class="settings-group-card">
          <div class="settings-section-title">图标与名称</div>
          <div class="setting-item">
            <label>App 图标定制</label>

            </div>
          </div>

          <div class="setting-item">
            <label>App 名称定制</label>
            <div id="icon-rename-grid" class="name-grid-compact">

            <button

            </button>

        <!-- 4. 声音与背景卡片 -->
        <div class="settings-group-card">
          <div class="settings-section-title">声音与背景</div>

          <div class="setting-item">
            <label>来电铃声 URL</label>
            <input
              type="text"
              id="ringtone-url-input"
              class="moe-input"
              placeholder="音频链接..."
            />
          </div>

          <div class="setting-item">
            <label>提示音 URL</label>
            <input
              type="text"
              id="notification-sound-url-input"
              class="moe-input"
              placeholder="音频链接..."
            />

          <div class="setting-item">
            <label>全局聊天背景</label>

              <div class="btn-col">

    <!-- 分享链接功能 HTML -->
    <div id="browser-screen" class="screen">
      <div class="header">

        <span id="browser-title"></span>
        <span style="width: 30px"></span>

    <div id="font-settings-screen" class="screen">
      <div class="header">
        <span class="back-btn" onclick="showScreen('home-screen')">‹</span>
        <span>字体预设</span>
        <span style="width: 30px"></span>
        <!-- 保留这个占位符，让标题能完美居中 -->
      </div>
      <div class="form-container" style="gap: 20px">
        <div class="font-library-notice" role="note">
          本地字体会保存在当前浏览器中。中文字体通常较大，优先使用 WOFF2
          可减少空间占用。
        </div>

        <section class="font-current-card" aria-labelledby="font-current-title">
          <div class="font-current-copy">
            <span id="font-current-title">当前字体</span>
            <strong id="font-current-name">默认字体</strong>
            <small id="font-current-status">使用应用默认字体</small>
          </div>
          <button
            type="button"
            class="preset-btn secondary font-current-reset"
            id="reset-font-btn"
          >
            恢复默认
          </button>
        </section>

        <div class="font-library-toolbar">
          <button type="button" class="preset-btn secondary" id="add-font-url-btn">
            URL 添加
          </button>
          <button type="button" class="preset-btn" id="add-font-local-btn">
            本地添加
          </button>
        </div>

        <div class="font-library-search-row">
          <input
            type="search"
            id="font-library-search"
            placeholder="搜索字体"
            autocomplete="off"
            aria-label="搜索字体"
          />
          <span id="font-library-count" aria-live="polite">0 个字体</span>
        </div>

        <!-- 字体预设列表的容器 -->
        <div id="font-preset-container">
          <!-- 字体卡片将由 JavaScript 动态生成在这里 -->
        </div>

        <!-- 全局字体预览区 -->
        <div class="form-group" style="width: 100%">
          <label>当前全局字体预览</label>
          <div id="font-preview">
            <p class="font-preview-heading">你好世界 Hello World 12345</p>
            <p class="font-preview-body">
              春风又绿江南岸。标点：“”‘’！？ ¥123.45
            </p>
          </div>
          <input
            type="text"
            id="font-preview-input"
            class="font-preview-input"
            placeholder="输入文字测试当前字体"
            autocomplete="off"
          />
        </div>
      </div>
    </div>

    <!-- 这个是隐藏的文件选择器，用来处理本地上传 -->
    <input
      type="file"
      id="font-preset-local-upload"
      accept=".ttf,.otf,.woff,.woff2"
      style="display: none"
    />
