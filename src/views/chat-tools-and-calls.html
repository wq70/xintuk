      <!-- ======================================================= -->
      <div id="visual-call-interface" style="display: none">

        <div class="video-background">

            <img src="" alt="主视频画面" />
            <video
              id="video-main-stream"
              autoplay
              playsinline
              muted
              style="
                display: none;
                width: 100%;
                height: 100%;
                object-fit: cover;
              "
            ></video>
          </div>
          <!-- 小图容器 (画中画) -->
          <div id="video-pip-view" class="video-container pip">
            <img src="" alt="小窗视频画面" />
            <video
              id="video-pip-stream"
              autoplay
              playsinline
              muted
              style="
                display: none;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transform: scaleX(-1);
              "
            ></video>
          </div>
        </div>

        <!-- 2. 顶部状态栏 -->
        <div class="video-call-top-bar">
          <button class="video-minimize-btn" onclick="minimizeVideoCall()">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
            </svg>
          </button>

          <span id="visual-call-timer">00:00</span>
        </div>

        <!-- 3. 聊天气泡显示区域 -->
        <div id="video-call-messages-visual" class="video-call-main">
          <!-- 聊天气泡会由JS动态生成在这里 -->
        </div>
        <!-- ▼▼▼ 用下面这【一整块】代码，替换掉 id="visual-call-interface" 里面那个旧的 video-call-controls 的 div ▼▼▼ -->
        <div class="video-call-controls">
          <!-- 重-roll按钮 -->
          <button
            id="reroll-call-btn"
            class="control-btn reroll-btn"
            title="重新生成"
          ></button>
          <button
            id="flip-real-camera-btn"
            class="control-btn"
            style="
              display: none;
              background-image: url(&quot;https://api.iconify.design/ion:camera-reverse-outline.svg?color=white&quot;);
              background-size: 60%;
              background-repeat: no-repeat;
              background-position: center;
            "
            title="翻转前后镜头"
          ></button>
          <!-- 【核心新增】发言按钮 -->
          <button
            id="user-speak-btn-visual"
            class="control-btn speak-btn"
            title="发言"
          ></button>
          <!-- 切换镜头按钮 -->
          <button
            id="switch-camera-btn"
            class="control-btn switch-camera-btn"
            title="切换镜头"
          ></button>
          <!-- 挂断按钮 -->
          <button
            id="hang-up-btn-visual"
            class="control-btn hangup-btn"
          ></button>
        </div>
        <!-- ▲▲▲ 替换结束 ▲▲▲ -->
      </div>
