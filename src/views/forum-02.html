    <div id="aurora-setup-modal" class="modal">

          >

                ><input type="radio" name="aurora-mode" value="video" checked />

              >
              <label
                ><input type="radio" name="aurora-mode" value="text" />

              >

    <!-- 漫游播放器弹窗 (已修复关闭按钮消失问题) -->
    <div
      id="aurora-player-overlay"
      style="
        display: none;
        position: absolute;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;
        height: 400px;
        background: #000;
        border-radius: 12px;
        z-index: 9999;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);

      <div
        id="aurora-drag-handle"
        style="
          width: 100%;
          height: 40px;
          flex-shrink: 0;
          padding: 0 10px;
          background: linear-gradient(90deg, #e0c3fc 0%, #8ec5fc 100%);
          cursor: grab;
          display: flex;
          align-items: center;
          justify-content: space-between;
          z-index: 100;
          box-sizing: border-box; /* ★★★ 核心修复：防止内容被挤出容器 ★★★ */

      >
        <span
          style="
            font-size: 14px;
            color: #333;
            font-weight: 800;
            pointer-events: none;
          "
          >✨ 漫游</span
        >

        <div style="display: flex; gap: 10px; align-items: center">
          <button
            id="aurora-font-down"
            style="
              background: rgba(255, 255, 255, 0.4);
              border: 1px solid rgba(0, 0, 0, 0.1);
              border-radius: 4px;
              padding: 2px 8px;
              font-weight: bold;
              cursor: pointer;
              color: #333;
              font-size: 12px;
            "
          >
            A-
          </button>
          <button
            id="aurora-font-up"
            style="
              background: rgba(255, 255, 255, 0.4);
              border: 1px solid rgba(0, 0, 0, 0.1);
              border-radius: 4px;
              padding: 2px 8px;
              font-weight: bold;
              cursor: pointer;
              color: #333;
              font-size: 12px;
            "
          >
            A+
          </button>
          <!-- 关闭按钮：加大字号，增加点击区域 -->
          <span
            id="aurora-close-player"
            style="
              cursor: pointer;
              font-weight: 900;
              color: #333;
              font-size: 24px;
              line-height: 1;
              padding: 0 5px;
            "
            >×</span
          >
        </div>
      </div>

      <div
        id="aurora-content-area"
        style="
          width: 100%;
          flex-grow: 1;
          position: relative;
          background: #000;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        "
      >
        <!-- 视频播放器 -->
        <video
          id="aurora-video-element"
          style="width: 100%; height: 100%; object-fit: contain; display: none"
          playsinline
          webkit-playsinline
        ></video>

        <!-- 文本阅读器 -->
        <div
          id="aurora-text-viewer"
          style="
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            font-family: sans-serif;
          "
        >
          <div id="aurora-text-body" style="white-space: pre-wrap"></div>
        </div>

        <!-- 自定义音画播放器 -->
        <div
          id="aurora-custom-viewer"
          style="display: none; width: 100%; height: 100%; position: relative"
        >
          <img
            id="aurora-custom-bg-img"
            style="width: 100%; height: 100%; display: block; object-fit: cover"
          />
          <div
            id="aurora-custom-subtitle-display"
            style="
              position: absolute;
              bottom: 10%;
              left: 0;
              width: 100%;
              text-align: center;
              color: white;
              text-shadow:
                0 2px 4px black,
                0 0 4px black;
              font-size: 16px;
              padding: 0 10px;
              pointer-events: none;
              font-weight: 500;
              z-index: 20;
            "
          ></div>
          <audio
            id="aurora-custom-audio-element"
            controls
            style="
              width: 100%;
              height: 40px;
              opacity: 0;
              position: absolute;
              bottom: 0;
              left: 0;
              z-index: 30;
            "
          ></audio>
        </div>
      </div>

      <!-- 底部栏 -->
      <div
        style="
          padding: 5px 12px;
          height: 28px;
          flex-shrink: 0;
          font-size: 12px;
          color: #888;
          background: #121212;
          border-top: 1px solid #333;
          display: flex;
          align-items: center;
          justify-content: space-between;

      >
        <span

        >
        <span

        >
        <span id="aurora-info-status">等待中...</span>

      <!-- 手机端触摸缩放手柄 -->
      <div
        id="aurora-resize-handle"
        style="
          position: absolute;
          bottom: 0;
          right: 0;
          width: 30px;
          height: 30px;
          background: linear-gradient(135deg, transparent 50%, #8ec5fc 50%);
          cursor: nwse-resize;
          z-index: 101;
          touch-action: none;
        "
      ></div>
    </div>
